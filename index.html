<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOEIC 단어 학습</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="topbar">
        <h1>TOEIC 단어 학습</h1>
        <p id="today-label">오늘의 단어</p>
      </header>

      <section class="summary-box">
        <span id="progress-text">0 / 10 완료</span>
        <button id="complete-btn" type="button">오늘 학습 완료</button>
      </section>

      <main>
        <div id="word-list" class="word-list" aria-live="polite"></div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
