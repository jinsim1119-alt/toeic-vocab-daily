<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Vocabulary Study</title>
    <link rel="stylesheet" href="style.css?v=20260817-1" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <span class="brand-badge">TOEIC</span>
          <h1>영어단어 학습</h1>
        </div>

        <nav class="menu" aria-label="메인 메뉴">
          <button class="menu-btn is-active" type="button" data-view="learn">학습</button>
          <button class="menu-btn" type="button" data-view="stats">학습 통계</button>
          <button class="menu-btn" type="button" data-view="quiz">실습</button>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">오늘의 학습</p>
            <h2 id="today-label">2026-08-17</h2>
          </div>
          <span id="day-badge" class="day-badge">Day 1</span>
        </header>

        <section id="learn-panel" class="panel is-active">
          <div class="summary-box">
            <div class="summary-meta">
              <span id="progress-text">0 / 10 완료</span>
              <small id="day-summary">Day 1 · 10개 단어</small>
            </div>
            <button id="complete-btn" type="button">오늘 학습 완료</button>
          </div>

          <div class="toolbar">
            <label class="date-picker-wrap">
              <span>날짜 선택</span>
              <input id="date-picker" type="date" />
            </label>
            <div class="toolbar-actions">
              <button id="prev-day-btn" type="button" class="secondary-btn">이전 날짜</button>
              <button id="next-day-btn" type="button" class="secondary-btn">다음 날짜</button>
            </div>
          </div>

          <div id="word-list" class="word-list" aria-live="polite"></div>
        </section>

        <section id="stats-panel" class="panel">
          <div class="stats-grid">
            <div class="stat-card">
              <span>학습 진행률</span>
              <strong id="progress-rate">0%</strong>
            </div>
            <div class="stat-card">
              <span>오늘 완료</span>
              <strong id="today-done">0 / 10</strong>
            </div>
            <div class="stat-card">
              <span>오답 수</span>
              <strong id="mistake-count">0개</strong>
            </div>
          </div>

          <div class="progress-track" aria-label="학습 진행도">
            <div id="progress-bar" class="progress-bar"></div>
          </div>

          <div class="panel-box">
            <div class="section-header">
              <h3>30일 학습 진도</h3>
            </div>
            <div id="history-list" class="history-list"></div>
          </div>

          <div class="panel-box">
            <div class="section-header">
              <h3>오답 복습</h3>
            </div>
            <div id="mistake-list" class="mistake-list"></div>
          </div>

          <button id="reset-btn" type="button" class="danger-btn">전체 데이터 초기화</button>
        </section>

        <section id="quiz-panel" class="panel">
          <div class="panel-box">
            <div class="section-header">
              <h3>실습 퀴즈</h3>
            </div>
            <div id="quiz-card" class="quiz-card">
              <p class="quiz-status">문제를 불러오는 중입니다...</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js?v=20260817-1"></script>
  </body>
</html>
